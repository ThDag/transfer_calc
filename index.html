<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="manifest" href="./manifest.json">
  <title>Commission Calculator</title>
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray: #999999;
      --accent: #ff2400;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::selection { background: var(--accent); color: var(--black); }
    body { background: var(--black); color: var(--white); padding: 48px 16px 24px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .card { background: var(--black); border: 3px solid var(--white); border-radius: 0; padding: 24px; width: 100%; max-width: 380px; box-shadow: 8px 8px 0 var(--accent); }
    label { display: block; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gray); margin-bottom: 8px; }
    .input-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 24px; }
    .currency-prefix { position: absolute; left: 14px; font-size: 24px; font-weight: 800; color: var(--white); pointer-events: none; }
    input { width: 100%; font-size: 28px; font-weight: 800; padding: 12px 14px 12px 34px; border-radius: 0; border: 2px solid var(--white); background: var(--black); color: var(--white); outline: none; caret-color: var(--accent); transition: border-color 0.15s, outline-color 0.15s; }
    input::placeholder { color: var(--gray); }
    input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
    .breakdown { display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--white); }
    .row .label { color: var(--gray); }
    .row .val { font-variant-numeric: tabular-nums; font-weight: 700; }
    .divider { height: 2px; background: var(--white); margin: 12px 0; }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; background: var(--accent); border: 2px solid var(--black); padding: 14px 16px; }
    .total-row .label { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--black); }
    .total-row .val { font-size: 28px; font-weight: 900; color: var(--black); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <div class="card">
    <label for="price">Product Price</label>
    <div class="input-wrapper">
      <span class="currency-prefix">$</span>
      <input type="number" id="price" placeholder="0.00" inputmode="decimal" autofocus>
    </div>

    <div class="breakdown">
      <div class="row">
        <span class="label">Platform Fee (10%)</span>
        <span class="val" id="fee">-$0.00</span>
      </div>
      <div class="row">
        <span class="label">Adjusted Base</span>
        <span class="val" id="base">$0.00</span>
      </div>
      <div class="row">
        <span class="label">Tier 1 Direct (15%)</span>
        <span class="val" id="tier1">$0.00</span>
      </div>
      <div class="row">
        <span class="label">Tier 2 Override (3%)</span>
        <span class="val" id="tier2">$0.00</span>
      </div>

      <div class="divider"></div>

      <div class="total-row">
        <span class="label">Net Commission</span>
        <span class="val" id="net">$0.00</span>
      </div>
    </div>
  </div>

  <script>
    // Calculation Logic
    const priceInput = document.getElementById('price');
    const feeEl = document.getElementById('fee');
    const baseEl = document.getElementById('base');
    const tier1El = document.getElementById('tier1');
    const tier2El = document.getElementById('tier2');
    const netEl = document.getElementById('net');

    const fmt = (num) => '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    priceInput.addEventListener('input', () => {
      const price = parseFloat(priceInput.value) || 0;

      const fee = price * 0.10;
      const base = price - fee;
      const tier1 = base * 0.15;
      const tier2 = base * 0.03;
      const net = tier1 + tier2;

      feeEl.textContent = '-' + fmt(fee);
      baseEl.textContent = fmt(base);
      tier1El.textContent = fmt(tier1);
      tier2El.textContent = fmt(tier2);
      netEl.textContent = fmt(net);
    });

    // Register Service Worker with relative path
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch((err) => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
