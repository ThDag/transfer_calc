<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HavCal">
  <link rel="manifest" href="./manifest.json">
  <title>HavCal</title>
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray: #999999;
      --accent: #87a96b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::selection { background: var(--accent); color: var(--black); }
    /* Lock the page to exactly the viewport height and kill iOS's rubber-band
       bounce: with real height instead of min-height plus overflow:hidden,
       there's nothing left for the standalone WebView to scroll or bounce. */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      background: var(--black);
      color: var(--white);
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* No outer card: the black page itself is the canvas. Structure comes
       from each element's own border (Twin Pair Fields, rate inputs, the
       export button) rather than one containing frame around everything. */
    .content { width: 100%; max-width: 380px; }
    label { display: block; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gray); margin-bottom: 8px; }
    .input-wrapper { position: relative; display: flex; align-items: stretch; gap: 8px; margin-bottom: 20px; }
    .currency-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 800; color: var(--white); pointer-events: none; }
    input { width: 100%; font-size: 28px; font-weight: 800; padding: 12px 14px; border-radius: 0; border: 2px solid var(--white); background: var(--black); color: var(--white); outline: none; caret-color: var(--accent); transition: border-color 0.15s, outline-color 0.15s; font-variant-numeric: tabular-nums; }
    input::placeholder { color: var(--gray); }
    input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Twin pair: Amount and Received Amount each show USD and AED as siblings
       sharing one bordered box, stacked top over bottom and split by one
       internal horizontal rule, rather than two independent fields — the
       shared border is what makes them read as one unit with two faces, not
       two coincidentally-adjacent inputs. Stacking (not side-by-side) gives
       each face the full width, room enough to stay legible at a size close
       to a real primary input. Each face carries its own small copy
       affordance inline, borderless, so it reads as part of that face
       rather than a third segment competing with the twin structure itself. */
    .pair-group { margin-bottom: 20px; }
    .pair-box { display: flex; flex-direction: column; border: 2px solid var(--white); border-radius: 0; background: var(--black); }
    .pair-field { min-width: 0; position: relative; display: flex; align-items: center; }
    .pair-field + .pair-field { border-top: 2px solid var(--white); }
    .pair-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 800; color: var(--gray); pointer-events: none; }
    .pair-field input { flex: 1; min-width: 0; border: none; background: transparent; font-size: 22px; padding: 14px 4px 14px 44px; }
    .pair-field input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
    .pair-mini-copy { flex-shrink: 0; width: 32px; height: 32px; margin-right: 8px; border: none; background: transparent; color: var(--gray); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; transition: color 0.15s, opacity 0.15s; }
    .pair-mini-copy:hover, .pair-mini-copy:focus-visible { color: var(--accent); outline: none; }
    .pair-mini-copy.copied { color: var(--accent); }
    .pair-mini-copy .icon-check { display: none; }
    .pair-mini-copy.copied .icon-copy { display: none; }
    .pair-mini-copy.copied .icon-check { display: block; }
    .pair-mini-copy:disabled { opacity: 0.3; cursor: default; }
    .pair-mini-copy:disabled:hover { color: var(--gray); }
    .pair-mini-copy svg { width: 15px; height: 15px; }

    /* Deliberately quiet: no full label above it, gray (not white) border,
       small footprint — adjustable without competing with the real inputs.
       The reset icon is quieter still: borderless, tiny, gray until hovered. */
    .fx-rate { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--gray); margin: 0 0 20px; }
    .fx-rate input { width: 68px; font-size: 12px; font-weight: 700; padding: 4px 6px; border: 2px solid var(--gray); border-radius: 0; background: var(--black); color: var(--white); text-align: center; outline: none; caret-color: var(--accent); }
    .fx-rate input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
    .fx-reset { flex-shrink: 0; width: 18px; height: 18px; margin-left: 2px; border: none; background: transparent; color: var(--gray); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
    .fx-reset:hover, .fx-reset:focus-visible { color: var(--accent); outline: none; }
    .fx-reset svg { width: 13px; height: 13px; }

    /* Copy buttons: same border language as inputs, flat, no motion flourish.
       Two icons live in the DOM; .copied toggles which one shows. */
    .copy-btn { flex-shrink: 0; width: 44px; border: 2px solid var(--white); border-radius: 0; background: var(--black); color: var(--white); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; transition: border-color 0.15s, color 0.15s, opacity 0.15s; }
    .copy-btn:hover, .copy-btn:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .copy-btn.copied { border-color: var(--accent); color: var(--accent); }
    .copy-btn .icon-check { display: none; }
    .copy-btn.copied .icon-copy { display: none; }
    .copy-btn.copied .icon-check { display: block; }
    .copy-btn:disabled { opacity: 0.35; cursor: default; }
    .copy-btn:disabled:hover { border-color: var(--white); color: var(--white); }
    .copy-btn-sm { width: 26px; height: 26px; }
    .copy-btn-sm svg { width: 13px; height: 13px; }

    .rate-caption { font-size: 12px; color: var(--gray); margin-bottom: 10px; }
    .rate-caption b { color: var(--white); font-weight: 800; }
    .rate-row { display: flex; gap: 12px; margin-bottom: 24px; }
    .rate-field { flex: 1; min-width: 0; }
    .rate-field label { font-size: 11px; }
    .rate-field .input-wrapper { margin-bottom: 0; }
    .rate-field input { font-size: 18px; padding: 10px 10px 10px 26px; }
    .rate-field .currency-prefix { font-size: 16px; left: 10px; }

    .divider { height: 2px; background: var(--white); margin: 4px 0 16px; }

    .breakdown { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .row { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--white); }
    .row .label { flex: 1; color: var(--gray); margin-bottom: 0; font-size: 13px; }
    .row .val { font-variant-numeric: tabular-nums; font-weight: 700; }

    /* The commission ledger: Service Comm + Our Comm, added, equal Comm Main.
       The addition is drawn literally so the sum is never just implied.
       Comm Main is styled at the same size/weight as its two parts — the
       sum isn't a bigger number, just the last one in the addition. */
    .ledger { display: flex; flex-direction: column; gap: 10px; }
    .ledger-op { text-align: center; font-size: 14px; font-weight: 800; color: var(--gray); }
    .ledger .row.accent-row .label,
    .ledger .row.accent-row .val { color: var(--accent); }
    .ledger-divider { height: 2px; background: var(--white); margin: 4px 0 2px; }
    .ledger .row.sum-row .label { color: var(--white); }

    /* The main export action: same flat border language as everything else,
       just full-width and carrying a visible label since it's the one button
       on the page meant to be found at a glance, not just recognized by icon. */
    .export-btn { width: 100%; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 16px; border: 2px solid var(--white); border-radius: 0; background: var(--black); color: var(--white); font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: border-color 0.15s, color 0.15s, opacity 0.15s; }
    .export-btn:hover, .export-btn:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .export-btn.copied { border-color: var(--accent); color: var(--accent); }
    .export-btn:disabled { opacity: 0.35; cursor: default; }
    .export-btn:disabled:hover { border-color: var(--white); color: var(--white); }
    .export-btn .icon-check { display: none; }
    .export-btn.copied .icon-copy { display: none; }
    .export-btn.copied .icon-check { display: block; }
  </style>
</head>
<body>

  <div class="content">
    <div class="pair-group">
      <label>Amount</label>
      <div class="pair-box">
        <div class="pair-field">
          <span class="pair-prefix">$</span>
          <input type="text" id="amountUsd" placeholder="0.00" inputmode="decimal" autofocus>
          <button type="button" class="pair-mini-copy" id="amountUsdCopy" aria-label="Copy USD amount" disabled>
            <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
        <div class="pair-field">
          <span class="pair-prefix">AED</span>
          <input type="text" id="amountAed" placeholder="0.00" inputmode="decimal">
          <button type="button" class="pair-mini-copy" id="amountAedCopy" aria-label="Copy AED amount" disabled>
            <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="fx-rate">
      <span>1 USD =</span>
      <input type="text" id="fxRate" value="3.6725" inputmode="decimal" aria-label="USD to AED exchange rate">
      <span>AED</span>
      <button type="button" class="fx-reset" id="fxReset" aria-label="Reset exchange rate to default">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>
      </button>
    </div>

    <div class="rate-caption">Both rates below apply to the <b>AED Amount</b> above.</div>
    <div class="rate-row">
      <div class="rate-field">
        <label for="servicePct">Service Rate %</label>
        <div class="input-wrapper">
          <span class="currency-prefix">%</span>
          <input type="text" id="servicePct" value="0.68" inputmode="decimal">
        </div>
      </div>
      <div class="rate-field">
        <label for="ourPct">Our Rate %</label>
        <div class="input-wrapper">
          <span class="currency-prefix">%</span>
          <input type="text" id="ourPct" value="0.30" inputmode="decimal">
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="breakdown">
      <div class="ledger">
        <div class="row">
          <span class="label">Service Comm</span>
          <span class="val" id="serviceComm">AED 0.00</span>
        </div>
        <div class="ledger-op">+</div>
        <div class="row accent-row">
          <span class="label">Our Comm</span>
          <span class="val" id="ourComm">AED 0.00</span>
          <button type="button" class="copy-btn copy-btn-sm" id="ourCommCopy" aria-label="Copy our commission amount">
            <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
        <div class="ledger-divider"></div>
        <div class="row sum-row">
          <span class="label">Comm Main (<span id="commPctLabel">0.98</span>% of AED)</span>
          <span class="val" id="commMain">AED 0.00</span>
        </div>
      </div>
    </div>

    <div class="pair-group">
      <label>Received Amount</label>
      <div class="pair-box">
        <div class="pair-field">
          <span class="pair-prefix">$</span>
          <input type="text" id="receivedUsd" placeholder="0.00" inputmode="decimal">
          <button type="button" class="pair-mini-copy" id="receivedUsdCopy" aria-label="Copy received USD amount" disabled>
            <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
        <div class="pair-field">
          <span class="pair-prefix">AED</span>
          <input type="text" id="receivedAed" placeholder="0.00" inputmode="decimal">
          <button type="button" class="pair-mini-copy" id="receivedAedCopy" aria-label="Copy received AED amount" disabled>
            <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
    </div>

    <button type="button" class="export-btn" id="exportBtn" aria-label="Copy full transfer summary" disabled>
      <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span class="export-label">Export Summary</span>
    </button>
  </div>

  <script>
    const amountUsdInput = document.getElementById('amountUsd');
    const amountAedInput = document.getElementById('amountAed');
    const receivedUsdInput = document.getElementById('receivedUsd');
    const receivedAedInput = document.getElementById('receivedAed');
    const fxRateInput = document.getElementById('fxRate');
    const fxResetBtn = document.getElementById('fxReset');
    const servicePctInput = document.getElementById('servicePct');
    const ourPctInput = document.getElementById('ourPct');

    const DEFAULT_FX_RATE = 3.6725;

    // USD -> AED rate: no network lookup, but adjustable in the UI (defaults
    // to the AED peg) rather than hardcoded, so it stays a single source of
    // truth with the field the user actually sees and can edit.
    let USD_TO_AED = parseFloat(fxRateInput.value) || DEFAULT_FX_RATE;

    const commPctLabelEl = document.getElementById('commPctLabel');
    const commMainEl = document.getElementById('commMain');
    const serviceCommEl = document.getElementById('serviceComm');
    const ourCommEl = document.getElementById('ourComm');

    const amountUsdCopyBtn = document.getElementById('amountUsdCopy');
    const amountAedCopyBtn = document.getElementById('amountAedCopy');
    const receivedUsdCopyBtn = document.getElementById('receivedUsdCopy');
    const receivedAedCopyBtn = document.getElementById('receivedAedCopy');
    const ourCommCopyBtn = document.getElementById('ourCommCopy');
    const exportBtn = document.getElementById('exportBtn');

    // Each mini copy button gates off its own field (they're always kept in
    // sync, so this is equivalent to gating off the pair, but reads simpler);
    // the export button gates off the AED principal — nothing to copy yet
    // shows as disabled rather than a silent no-op.
    function syncCopyButtons() {
      amountUsdCopyBtn.disabled = !amountUsdInput.value.trim();
      amountAedCopyBtn.disabled = !amountAedInput.value.trim();
      receivedUsdCopyBtn.disabled = !receivedUsdInput.value.trim();
      receivedAedCopyBtn.disabled = !receivedAedInput.value.trim();
      exportBtn.disabled = !amountAedInput.value.trim();
    }

    const fmtAED = (num) => 'AED ' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const parseNum = (str) => parseFloat(String(str).replace(/,/g, '')) || 0;
    const formatFixed = (num) => num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Reformats a field's own displayed text with thousands separators while the
    // user is actively typing into it, preserving cursor position, and returns
    // the clean numeric value typed so far (not rounded/padded, since typing is
    // still in progress).
    function liveFormat(input) {
      const cursor = input.selectionStart;
      const before = input.value;

      let cleaned = before.replace(/,/g, '').replace(/[^\d.]/g, '');
      const firstDot = cleaned.indexOf('.');
      if (firstDot !== -1) {
        cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
      }

      let [intPart, decPart] = cleaned.split('.');
      intPart = (intPart || '').replace(/^0+(?=\d)/, '');
      const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      const after = decPart !== undefined ? grouped + '.' + decPart : grouped;

      input.value = after;
      const newCursor = Math.max(0, cursor + (after.length - before.length));
      input.setSelectionRange(newCursor, newCursor);

      return parseFloat(cleaned) || 0;
    }

    // Reformat a field to a clean, fixed 2-decimal, comma-grouped value once the
    // user leaves it (no cursor to preserve, so a full reformat is safe here).
    function formatOnBlur(input) {
      input.addEventListener('blur', () => {
        if (!input.value.trim()) return;
        input.value = formatFixed(parseNum(input.value));
      });
    }
    [amountUsdInput, amountAedInput, receivedUsdInput, receivedAedInput, servicePctInput, ourPctInput].forEach(formatOnBlur);

    // The exchange rate keeps its own precision (a peg like 3.6725 needs 4
    // decimal places, not the 2 every money field rounds to).
    fxRateInput.addEventListener('blur', () => {
      if (!fxRateInput.value.trim()) return;
      fxRateInput.value = parseNum(fxRateInput.value).toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    });

    // Commission math: CommMain is not its own rate, it is always exactly the sum
    // of the two splits, so the two percentages can never drift out of sync with
    // the total.
    function calcCommission(aed, servicePct, ourPct) {
      const commPct = servicePct + ourPct;
      const serviceComm = aed * (servicePct / 100);
      const ourComm = aed * (ourPct / 100);
      const commMain = serviceComm + ourComm;
      const received = aed - commMain;
      return { commPct, serviceComm, ourComm, commMain, received };
    }

    function renderBreakdown({ commPct, serviceComm, ourComm, commMain }) {
      commPctLabelEl.textContent = commPct.toLocaleString('en-US', { maximumFractionDigits: 2 });
      commMainEl.textContent = fmtAED(commMain);
      serviceCommEl.textContent = fmtAED(serviceComm);
      ourCommEl.textContent = fmtAED(ourComm);
    }

    function currentRates() {
      return { servicePct: parseNum(servicePctInput.value), ourPct: parseNum(ourPctInput.value) };
    }

    // The single source of truth for every derived field: given the AED
    // principal, this updates both twin pairs (Amount USD/AED, Received
    // USD/AED) and the breakdown — except `skip`, the field the user is
    // actually typing into, which keeps exactly what they typed rather than
    // being reformatted out from under their cursor.
    function applyFromAed(aed, skip) {
      const { servicePct, ourPct } = currentRates();
      const result = calcCommission(aed, servicePct, ourPct);

      if (skip !== amountUsdInput) amountUsdInput.value = aed ? formatFixed(aed / USD_TO_AED) : '';
      if (skip !== amountAedInput) amountAedInput.value = aed ? formatFixed(aed) : '';
      if (skip !== receivedAedInput) receivedAedInput.value = aed ? formatFixed(result.received) : '';
      if (skip !== receivedUsdInput) receivedUsdInput.value = aed ? formatFixed(result.received / USD_TO_AED) : '';

      renderBreakdown(result);
      syncCopyButtons();
    }

    // Editing either Amount field sets the transfer principal; both Received
    // fields and the whole breakdown follow from it.
    amountUsdInput.addEventListener('input', () => {
      const usd = liveFormat(amountUsdInput);
      applyFromAed(usd * USD_TO_AED, amountUsdInput);
    });

    amountAedInput.addEventListener('input', () => {
      const aed = liveFormat(amountAedInput);
      applyFromAed(aed, amountAedInput);
    });

    // Editing either Received field back-solves the AED principal needed to
    // net exactly that amount after commission, holding the current rates
    // fixed, then cascades back out to both Amount fields.
    receivedAedInput.addEventListener('input', () => {
      const receivedAed = liveFormat(receivedAedInput);
      const { servicePct, ourPct } = currentRates();
      const denom = 1 - (servicePct + ourPct) / 100;
      const aed = denom > 0 ? receivedAed / denom : 0;
      applyFromAed(aed, receivedAedInput);
    });

    receivedUsdInput.addEventListener('input', () => {
      const receivedUsd = liveFormat(receivedUsdInput);
      const receivedAed = receivedUsd * USD_TO_AED;
      const { servicePct, ourPct } = currentRates();
      const denom = 1 - (servicePct + ourPct) / 100;
      const aed = denom > 0 ? receivedAed / denom : 0;
      applyFromAed(aed, receivedUsdInput);
    });

    // Editing either rate keeps the current AED principal fixed and only
    // re-splits the commission, which changes Received Amount downstream.
    function onRateInput(input) {
      liveFormat(input);
      applyFromAed(parseNum(amountAedInput.value), null);
    }
    servicePctInput.addEventListener('input', () => onRateInput(servicePctInput));
    ourPctInput.addEventListener('input', () => onRateInput(ourPctInput));

    // Recomputes from the current fx rate, holding whichever Amount side the
    // user actually entered fixed (USD if present, else AED). Shared by the
    // rate field's own input handler and the reset button.
    function recomputeFromRate() {
      if (amountUsdInput.value.trim()) {
        applyFromAed(parseNum(amountUsdInput.value) * USD_TO_AED, amountUsdInput);
      } else if (amountAedInput.value.trim()) {
        applyFromAed(parseNum(amountAedInput.value), amountAedInput);
      }
    }

    fxRateInput.addEventListener('input', () => {
      const rate = liveFormat(fxRateInput);
      if (rate <= 0) return;
      USD_TO_AED = rate;
      recomputeFromRate();
    });

    fxResetBtn.addEventListener('click', () => {
      fxRateInput.value = String(DEFAULT_FX_RATE);
      USD_TO_AED = DEFAULT_FX_RATE;
      recomputeFromRate();
    });

    // Initial render (all fields empty)
    {
      const { servicePct, ourPct } = currentRates();
      renderBreakdown(calcCommission(0, servicePct, ourPct));
      syncCopyButtons();
    }

    // Copy buttons: copy the value exactly as displayed (with its currency
    // prefix), so what's copied matches what's on screen with no guessing.
    async function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    // `textEl` is optional: the export button has a visible label to swap to
    // "Copied", where the small icon-only field buttons rely on the icon swap
    // (and aria-label) alone.
    function setupCopyButton(button, getText, label, textEl) {
      const idleText = textEl ? textEl.textContent : null;
      button.addEventListener('click', async () => {
        if (button.disabled) return;
        const text = getText();
        if (!text) return;
        try {
          await copyText(text);
        } catch (err) {
          console.error('Copy failed:', err);
          return;
        }
        button.classList.add('copied');
        button.setAttribute('aria-label', label + ' copied');
        if (textEl) textEl.textContent = 'Copied';
        clearTimeout(button._copyTimeout);
        button._copyTimeout = setTimeout(() => {
          button.classList.remove('copied');
          button.setAttribute('aria-label', 'Copy ' + label);
          if (textEl) textEl.textContent = idleText;
        }, 1200);
      });
    }

    // Each face of a twin pair copies its own value with its own currency
    // prefix — back to one copy action per currency, not one per pair.
    setupCopyButton(amountUsdCopyBtn, () => amountUsdInput.value.trim() ? `$${amountUsdInput.value.trim()}` : '', 'USD amount');
    setupCopyButton(amountAedCopyBtn, () => amountAedInput.value.trim() ? `AED ${amountAedInput.value.trim()}` : '', 'AED amount');
    setupCopyButton(receivedUsdCopyBtn, () => receivedUsdInput.value.trim() ? `$${receivedUsdInput.value.trim()}` : '', 'received USD amount');
    setupCopyButton(receivedAedCopyBtn, () => receivedAedInput.value.trim() ? `AED ${receivedAedInput.value.trim()}` : '', 'received AED amount');
    setupCopyButton(ourCommCopyBtn, () => ourCommEl.textContent, 'our commission amount');

    // The export button copies everything at once, laid out as a small
    // labeled receipt in the same order the page itself reads: the transfer
    // principal, the rate, the rates that drove the split, the commission
    // ledger, then the bottom-line result.
    function buildExportSummary() {
      return [
        `Amount (USD): $${amountUsdInput.value.trim()}`,
        `Amount (AED): AED ${amountAedInput.value.trim()}`,
        `Rate: 1 USD = ${fxRateInput.value.trim()} AED`,
        '',
        `Service Rate: ${servicePctInput.value.trim()}%`,
        `Our Rate: ${ourPctInput.value.trim()}%`,
        `Service Comm: ${serviceCommEl.textContent}`,
        `Our Comm: ${ourCommEl.textContent}`,
        `Comm Main (${commPctLabelEl.textContent}% of AED): ${commMainEl.textContent}`,
        '',
        `Received Amount (USD): $${receivedUsdInput.value.trim()}`,
        `Received Amount (AED): AED ${receivedAedInput.value.trim()}`,
      ].join('\n');
    }
    setupCopyButton(exportBtn, buildExportSummary, 'transfer summary', exportBtn.querySelector('.export-label'));

    // Register Service Worker with relative path
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch((err) => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
